name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:     # 允许手动触发

permissions:
  contents: write   # 必须，否则没法创建/更新 Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 2026/09 后 tools 包已下架，必须用 v4 + 明确 packages
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew assembleRelease --stacktrace --no-daemon
          echo "=== APK files ==="
          find app/build/outputs/apk -name "*.apk" -type f

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*release*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"
          ls -lh "$APK"

      # 仍然保留 artifact（方便调试）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webview-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # 关键步骤：把 APK 挂到 GitHub Release
      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          # 如果想强制覆盖同名文件，可以加：
          # fail_on_unmatched_files: true