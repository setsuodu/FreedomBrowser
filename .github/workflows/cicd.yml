name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - run: chmod +x gradlew || true

      - name: Build Release APK
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*release*.apk" -type f | head -n 1)
          [ -z "$APK" ] && APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          [ -z "$APK" ] && { echo "No APK found"; exit 1; }
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webview-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      - name: Upload to Fenfa
        env:
          FENFA_UPLOAD_URL: ${{ secrets.FENFA_UPLOAD_URL }}
          FENFA_UPLOAD_TOKEN: ${{ secrets.FENFA_UPLOAD_TOKEN }}
          FENFA_VARIANT_ID: ${{ secrets.FENFA_VARIANT_ID }}
        run: |
          set -e

          if [ -z "$FENFA_UPLOAD_URL" ] || [ -z "$FENFA_UPLOAD_TOKEN" ] || [ -z "$FENFA_VARIANT_ID" ]; then
            echo "⚠️ Fenfa secrets 未配置，跳过上传"
            exit 0
          fi

          APK="${{ steps.apk.outputs.path }}"
          TAG="${{ github.ref_name }}"
          VERSION=$(echo "$TAG" | sed -E 's/^v//')
          CHANGELOG="Release $TAG"

          echo "Uploading $APK (version=$VERSION) to Fenfa..."

          RESP=$(curl -s -w "\n%{http_code}" -X POST "$FENFA_UPLOAD_URL" \
            -H "X-Auth-Token: $FENFA_UPLOAD_TOKEN" \
            -F "variant_id=$FENFA_VARIANT_ID" \
            -F "app_file=@$APK" \
            -F "version=$VERSION" \
            -F "changelog=$CHANGELOG")

          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')

          echo "HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Fenfa upload failed"
            exit 1
          fi

          echo "✅ Uploaded to Fenfa"